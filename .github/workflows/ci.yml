name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-lint-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-typecheck-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: make typecheck

      - name: Run mypy (strict on security modules)
        # Call the Makefile target so CI and `make typecheck-strict` cannot drift.
        run: make typecheck-strict

      - name: Check type coverage
        run: make typecheck-coverage

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-test-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e ".[dev,openai,anthropic,nlp]"

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-fail-under=88
          -m "not slow and not integration and not performance"

  optional-extras:
    name: Optional extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - openai
          - anthropic
          - huggingface
          - signing
          - crypto
          - nlp
          - visualization
          - langchain
          - serving
          - providers
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-extra-${{ matrix.extra }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-extra-${{ matrix.extra }}-

      - name: Install optional extra
        run: pip install -e ".[${{ matrix.extra }}]"

      - name: Smoke-test imports
        run: python scripts/check_optional_imports.py "${{ matrix.extra }}"

  all-features:
    name: Constrained all-features test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-all-features-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-all-features-

      - name: Install all features
        run: pip install -e ".[all]"

      - name: Smoke-test all optional imports
        run: python scripts/check_optional_imports.py all

      - name: Run constrained feature tests
        run: >
          python -m pytest
          tests/test_models_openai.py
          tests/test_models_anthropic.py
          tests/test_models_huggingface.py
          tests/test_nlp_dependencies.py
          tests/test_visualization.py
          tests/test_langchain_integration.py
          tests/test_shadow_fastapi.py
          tests/test_tuf_client.py
          tests/test_oras.py
          tests/test_encryption.py
          -m "not slow and not integration"
          -k "not test_fetch_dataset_refuses_implicit_mock"

  determinism:
    name: Determinism (golden-path)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-determinism-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-determinism-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run golden-path determinism check
        run: make golden-path

  contracts:
    name: Stability Contracts
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-contracts-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-contracts-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests
        run: python -m pytest -m contract -v
