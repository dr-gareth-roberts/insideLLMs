name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-lint-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Documentation contract and links
        run: make docs-audit

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-typecheck-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: make typecheck

      - name: Run mypy (strict on security modules)
        # Call the Makefile target so CI and `make typecheck-strict` cannot drift.
        run: make typecheck-strict

      - name: Check type coverage
        run: |
          mypy insideLLMs --any-exprs-report ./mypy-coverage
          python scripts/check_type_coverage.py ./mypy-coverage

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-test-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e ".[dev,openai,anthropic,nlp]"

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-fail-under=95
          -m "not slow and not integration and not performance"

  full-extras:
    name: Full extras ([all])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-all-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-all-

      # No other job installs [all], so the signing, crypto, visualization,
      # langchain and serving surfaces -- including the tuf/oras/cryptography
      # supply-chain code -- are otherwise never exercised in CI.
      - name: Install dependencies
        run: pip install -e ".[all]"

      - name: Type check with the full extras present
        run: make typecheck

      - name: Run tests
        run: python -m pytest -m "not slow and not integration and not performance"

  determinism:
    name: Determinism (golden-path)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-determinism-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-determinism-

      - name: Run clean-install golden-path determinism check
        run: make clean-install-golden-path

  architecture:
    name: Architecture Contracts
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-architecture-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-architecture-

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Check generated evidence and import boundaries
        run: make architecture

  contracts:
    name: Stability Contracts
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-contracts-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-contracts-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests
        run: python -m pytest -m contract -v
