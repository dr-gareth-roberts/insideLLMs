name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality gate (lint + typecheck + test + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Install (core-only, matching CI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint, format, typecheck, test
        run: make check
      - name: Determinism golden-path
        run: make golden-path

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Require the release tag to match package metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF"] == f"refs/tags/v{version}", "Tag/package version mismatch"
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  package-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install base distribution in a clean environment
        env:
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          if [ "$ARTIFACT_KIND" = wheel ]; then
            "$RUNNER_TEMP/package-smoke/bin/python" -m pip install dist/*.whl
          else
            "$RUNNER_TEMP/package-smoke/bin/python" -m pip install dist/*.tar.gz
          fi
          "$RUNNER_TEMP/package-smoke/bin/python" scripts/smoke_installed_package.py

  github-release:
    needs: [build, package-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  pypi:
    needs: [build, package-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
