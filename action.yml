name: "insideLLMs PR Diff"
description: "Run base/head harnesses with read-only permissions and gate on healthy behavioural results."
author: "insideLLMs Contributors"

inputs:
  harness-config:
    description: "Harness config path relative to repository root."
    default: "ci/harness.yaml"
  baseline-ref:
    description: "Git ref to compare against (defaults to pull request base ref or main)."
    default: ""
  python-version:
    description: "Python version for the action runtime."
    default: "3.11"
  install-extras:
    description: "Optional extras to install (for example: dev,nlp,visualization)."
    default: ""
  run-args:
    description: "Extra arguments forwarded to each harness invocation."
    default: ""
  diff-args:
    description: "Extra arguments forwarded to diff."
    default: ""
  fail-on-changes:
    description: "When true, use --fail-on-any-difference (including improvements and trace changes)."
    default: "true"
  post-pr-comment:
    description: "Deprecated: inline commenting is disabled. Use a trusted workflow_run comment workflow."
    default: "false"
  comment-on-forks:
    description: "Deprecated: inline commenting is disabled for all pull requests."
    default: "false"

outputs:
  diff-json:
    description: "Path to the diff report, or a run health error report."
    value: ${{ steps.run_diff.outputs.diff_json }}
  baseline-run-dir:
    description: "Path to baseline run artifacts, retained even when unhealthy."
    value: ${{ steps.run_diff.outputs.baseline_run_dir }}
  candidate-run-dir:
    description: "Path to candidate run artifacts, retained even when unhealthy."
    value: ${{ steps.run_diff.outputs.candidate_run_dir }}
  diff-exit-code:
    description: "Gate exit code: 1 for unhealthy runs/errors, or the diff policy exit code."
    value: ${{ steps.run_diff.outputs.diff_exit_code }}
  baseline-commit:
    description: "Resolved baseline commit."
    value: ${{ steps.run_diff.outputs.baseline_commit }}
  is-fork-pr:
    description: "Whether the pull request head is from a fork."
    value: ${{ steps.run_diff.outputs.is_fork_pr }}
  comment-status:
    description: "Inline comments are disabled; use a separate trusted workflow."
    value: "disabled-inline-commenting"
  pr-report-json:
    description: "Small allowlisted report for the trusted comment workflow."
    value: ${{ steps.run_diff.outputs.pr_report_json }}

runs:
  using: "composite"
  steps:
    - name: Explain comment migration
      if: ${{ inputs.post-pr-comment == 'true' || inputs.comment-on-forks == 'true' }}
      shell: bash
      run: echo "::warning::Inline PR comments have been removed. Use contents:read, persist-credentials:false, and a separate trusted workflow_run comment workflow (see ci/README.md)."

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run base/head harness and health/diff gates
      id: run_diff
      shell: bash
      env:
        INPUT_HARNESS_CONFIG: ${{ inputs.harness-config }}
        INPUT_BASELINE_REF: ${{ inputs.baseline-ref }}
        INPUT_INSTALL_EXTRAS: ${{ inputs.install-extras }}
        INPUT_RUN_ARGS: ${{ inputs.run-args }}
        INPUT_DIFF_ARGS: ${{ inputs.diff-args }}
        INPUT_FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
        INSIDELLMS_ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/scripts/github_action_run.sh"

    - name: Fail on health or diff gate
      if: ${{ steps.run_diff.outputs.diff_exit_code != '0' }}
      shell: bash
      env:
        GATE_EXIT_CODE: ${{ steps.run_diff.outputs.diff_exit_code }}
      run: |
        case "${GATE_EXIT_CODE}" in
          1|2|3|4|5) exit "${GATE_EXIT_CODE}" ;;
          *) echo "Missing or invalid gate result" >&2; exit 1 ;;
        esac
